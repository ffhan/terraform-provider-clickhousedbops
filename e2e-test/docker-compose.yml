version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: testdb
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --user default --password password -q 'SELECT 1' || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - test-network

networks:
  test-network:
    driver: bridge

volumes:
  clickhouse_data:
